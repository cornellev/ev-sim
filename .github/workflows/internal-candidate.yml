name: Internal headless candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e './python[sb3,test]'
      - run: npm run lint
      - run: npm test
      - run: npm run test:marketplace
      - run: npm run benchmark:visual-scale:quick -- --output artifacts/visual-scale-hosted-quick.json
      - run: npm run build
      - name: Verify fixture drift
        run: |
          npm run fixtures:headless
          npm run fixtures:environment-editor
          git diff --exit-code -- \
            tests/fixtures/headless/characterization.v1.json \
            tests/fixtures/environment-editor/compatibility-baseline.v1.json
      - run: npm run proto:python
      - run: npm run lint:python
      - run: npm run test:python
      - run: npm run test:parity -- --output artifacts/parity-linux.json
      - run: npm run test:soak -- --output artifacts/headless-soak.json
      - run: npm run benchmark:headless -- --output artifacts/headless-benchmark.json
      - run: npm run dist:headless -- --output artifacts/headless
      - run: npm run release:check -- --dist artifacts/headless
      - run: npm run dist:verify -- --dist artifacts/headless
      - name: Resolve package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cev-sim-headless-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: |
            artifacts/headless/*
            artifacts/*.json
          if-no-files-found: error
          retention-days: 90

  production-browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Production UI
        run: npm run test:ui -- --workers=1
      - name: Production accessibility
        run: npm run test:a11y -- --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-candidate-${{ github.sha }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
