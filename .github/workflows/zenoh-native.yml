name: Native Zenoh transport

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bullseye
      options: --shm-size=256m
    timeout-minutes: 90
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y build-essential pkg-config curl ca-certificates git python3
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Install pinned Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Native ownership and queue tests
        run: cargo test --locked --manifest-path native/zenoh-transport/Cargo.toml
      - name: Build pinned native artifact
        run: node scripts/build-zenoh-transport.mjs --output artifacts/zenoh
      - name: Install pinned router
        run: cargo install zenohd --version 1.10.2 --locked --no-default-features --features shared-memory,zenoh/transport_tcp
      - name: Real native router and shared-memory integration
        env:
          CEV_SIM_ZENOH_TEST_ADDON: artifacts/zenoh/cev-sim-zenoh-linux-${{ matrix.architecture }}.node
          CEV_SIM_ZENOH_TEST_CONSUMER: native/zenoh-transport/target/debug/consumer
        run: |
          cargo build --locked --manifest-path native/zenoh-transport/Cargo.toml --bin consumer
          node --experimental-default-type=module --test tests/zenoh-native-integration.test.js
      - name: Install verified artifact for headless execution
        run: |
          node --input-type=module -e "import { installZenohArtifact } from './scripts/lib/zenoh-artifacts.mjs'; import { readFile } from 'node:fs/promises'; const dist='artifacts/zenoh'; const record=JSON.parse(await readFile(dist+'/cev-sim-zenoh-linux-${{ matrix.architecture }}.node.json')); await installZenohArtifact(dist,{nativeTransports:[record]},'.');"
      - name: Headless external driving and graceful interruption
        env:
          CEV_SIM_ZENOH_TEST_ADDON: artifacts/zenoh/cev-sim-zenoh-linux-${{ matrix.architecture }}.node
        run: node --experimental-default-type=module --test tests/zenoh-headless-integration.test.js
      - name: Collect publication copy and memory report
        run: >-
          node scripts/zenoh-transport-probe.mjs
          --addon artifacts/zenoh/cev-sim-zenoh-linux-${{ matrix.architecture }}.node
          --output artifacts/zenoh-${{ matrix.architecture }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zenoh-linux-${{ matrix.architecture }}-${{ github.sha }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 90
