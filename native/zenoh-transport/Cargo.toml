[package]
name = "cev-zenoh-transport"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zenoh = { version = "=1.10.2", default-features = false, features = ["transport_tcp", "shared-memory", "unstable"] }
napi = { version = "=2.16.17", default-features = false, features = ["napi8", "tokio_rt", "serde-json", "dyn-symbols"] }
napi-derive = "=2.16.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "macros"] }

[build-dependencies]
napi-build = "=2.1.3"

[profile.release]
lto = "thin"
strip = "symbols"
