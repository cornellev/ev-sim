<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup preview · cev-sim</title>
  <style>
    :root {
      color-scheme: dark;
      --slate-bg: #17181a;
      --slate-surface-1: #1c1e20;
      --slate-surface-2: #1f2123;
      --slate-surface-3: #212325;
      --slate-surface-hover: #27292b;
      --slate-ink: #e9eaec;
      --slate-fg: #f4f4f4;
      --slate-fg-2: #c2c4c6;
      --slate-muted: #8a8a8a;
      --slate-border: rgb(255 255 255 / 0.09);
      --slate-border-60: rgb(255 255 255 / 0.06);
      --slate-border-70: rgb(255 255 255 / 0.08);
      --slate-success: #78b98d;
      --slate-ring: rgb(255 255 255 / 0.62);
      --slate-floating: rgb(28 30 32 / 0.94);
      --radius: 4px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr);
      background: var(--slate-bg);
      color: var(--slate-fg);
      font-family: var(--font);
      font-size: 14px;
    }
    button, select { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--slate-ring); outline-offset: 2px; }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      border-bottom: 1px solid var(--slate-border);
      background: var(--slate-surface-1);
    }
    .identity { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .product { color: var(--slate-muted); font-size: 11px; }
    .identity h1 { margin: 0; font-size: 13px; font-weight: 600; }
    .identity p { margin: 0; overflow: hidden; color: var(--slate-muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .switch { display: flex; padding: 2px; border: 1px solid var(--slate-border-70); border-radius: var(--radius); background: var(--slate-surface-2); }
    .switch button, .text-button, .primary, .example, select {
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      cursor: pointer;
    }
    .switch button { height: 28px; padding: 0 10px; color: var(--slate-fg-2); font-size: 13px; }
    .switch button[aria-pressed="true"] { background: var(--slate-surface-3); color: var(--slate-fg); }
    .spacer { flex: 1; }
    .text-button { height: 32px; padding: 0 8px; color: var(--slate-fg-2); font-size: 13px; }
    .text-button:hover, .example:hover { background: var(--slate-surface-hover); color: var(--slate-fg); }
    .primary {
      height: 32px;
      padding: 0 12px;
      background: var(--slate-ink);
      color: var(--slate-bg);
      font-size: 13px;
      font-weight: 600;
    }
    .primary[aria-pressed="true"] { background: var(--slate-success); color: #17181a; }
    main { min-height: 0; }
    .layout, .tabs-layout { height: 100%; min-height: 0; }
    .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); }
    .rail, .detail {
      min-height: 0;
      overflow: auto;
      padding: 16px;
    }
    .rail { border-right: 1px solid var(--slate-border); background: var(--slate-surface-1); }
    .rail h2, .detail h2 { margin: 0 0 8px; color: var(--slate-muted); font-size: 11px; font-weight: 500; }
    .example {
      display: grid;
      width: 100%;
      gap: 2px;
      margin-bottom: 6px;
      padding: 10px 12px;
      text-align: left;
    }
    .example[aria-current="true"] { background: var(--slate-surface-3); box-shadow: inset 1px 0 0 var(--slate-ink); }
    .example b { font-size: 13px; font-weight: 550; }
    .example span, .note, .field span { color: var(--slate-muted); font-size: 12px; }
    .stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; height: 100%; }
    .stage-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .stage-foot .text-button { flex: none; }
    svg { width: 100%; height: 100%; min-height: 280px; background: #22241f; border-radius: var(--radius); cursor: crosshair; }
    .note { margin: 0; }
    .choices { display: grid; align-content: start; gap: 16px; max-width: 420px; }
    .field { display: grid; gap: 6px; }
    .field b { font-size: 13px; font-weight: 550; }
    select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--slate-border-70);
      background: var(--slate-surface-3);
    }
    .supply { margin: 0; color: var(--slate-fg-2); font-size: 13px; line-height: 1.45; }
    .tabs-layout { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .tablist { display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; border-bottom: 1px solid var(--slate-border); }
    .tablist button {
      flex: none;
      height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--slate-fg-2);
      cursor: pointer;
    }
    .tablist button[aria-selected="true"] { background: var(--slate-surface-3); color: var(--slate-fg); }
    .tab-body { display: grid; place-content: center; padding: 24px; color: var(--slate-muted); text-align: center; }
    .tab-body p { margin: 8px 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="switch" role="group" aria-label="Setup screen">
      <button type="button" id="job-scenario" aria-pressed="true">Scenario</button>
      <button type="button" id="job-run" aria-pressed="false">Run</button>
    </div>
    <div class="identity">
      <span class="product">cev-sim</span>
      <h1 id="title">Scenarios</h1>
      <p id="subtitle">Follow the route</p>
    </div>
    <span class="spacer"></span>
    <button type="button" class="text-button" id="tabs-toggle">Show today's tabs</button>
    <button type="button" class="primary" id="launch" hidden>Launch</button>
  </header>
  <main>
    <div class="layout" id="scenario-screen">
      <aside class="rail" aria-label="Examples">
        <h2>Examples</h2>
        <div id="scenario-examples"></div>
      </aside>
      <section class="detail">
        <div class="stage">
          <svg id="map" viewBox="0 0 640 480" role="img" aria-label="Route map. Click the road to add a waypoint."></svg>
          <div class="stage-foot">
            <p class="note" id="defaults"></p>
            <button type="button" class="text-button" id="scenario-more">Actors, triggers, and pass/fail</button>
          </div>
        </div>
      </section>
    </div>
    <div class="layout" id="run-screen" hidden>
      <aside class="rail">
        <h2>Scenario</h2>
        <div id="run-examples"></div>
      </aside>
      <section class="detail">
        <div class="choices">
          <p class="supply">The selected scenario supplies the environment, actors, poses, routes, and events. This run supplies the ego vehicle.</p>
          <label class="field">
            <b>Ego vehicle</b>
            <select id="vehicle" aria-label="Ego vehicle">
              <option value="igvc-car">IGVC Car</option>
              <option value="big-car">Big Car</option>
              <option value="scenario-car">Scenario Car</option>
            </select>
          </label>
          <button type="button" class="text-button" id="run-more">Sensors, clock, logging, and the rest</button>
        </div>
      </section>
    </div>
    <div class="tabs-layout" id="tabs-screen" hidden>
      <div class="tablist" id="tablist" role="tablist"></div>
      <div class="tab-body">
        <b id="tab-name">Overview</b>
        <p>Preview only. These tabs are the current editor, not a form.</p>
      </div>
    </div>
  </main>
  <script>
    const ROAD = [[320, 440], [320, 340], [280, 250], [360, 160], [320, 50]];
    const EXAMPLES = {
      follow: {
        name: "Follow the route",
        hint: "The built-in follower drives to the end.",
        driver: "The built-in route follower drives. The run finishes at the end of the route.",
        waypoints: [[320, 420], [320, 300], [300, 210], [340, 120]]
      },
      stop: {
        name: "Stop at the line",
        hint: "The built-in follower stops at the line.",
        driver: "The built-in route follower drives. The run finishes when the car reaches the stop line.",
        stop: true,
        waypoints: [[320, 420], [318, 340], [290, 250]]
      },
      outside: {
        name: "Drive from outside",
        hint: "An external controller drives the car.",
        driver: "An external controller drives the car. The run finishes at the end of the route.",
        waypoints: [[320, 420], [330, 280], [340, 140]]
      }
    };
    const SCENARIO_TABS = ["Overview", "Routes", "Actors", "Zones & triggers", "Timeline", "Completion", "Expected outcomes"];
    const RUN_TABS = ["Overview", "Scenario", "Initial State", "Clock", "Controls", "Sensors", "Observation", "Scripts", "Topics", "Assertions", "Logging", "Provenance", "JSON"];

    const state = {
      job: "scenario",
      example: "follow",
      tabs: false,
      tab: 0,
      launched: false,
      routes: {
        follow: EXAMPLES.follow.waypoints.map((point) => point.slice()),
        stop: EXAMPLES.stop.waypoints.map((point) => point.slice()),
        outside: EXAMPLES.outside.waypoints.map((point) => point.slice())
      }
    };

    const map = document.getElementById("map");

    function project(point) {
      let best = null;
      let traveled = 0;
      for (let index = 0; index < ROAD.length - 1; index += 1) {
        const start = ROAD[index];
        const end = ROAD[index + 1];
        const dx = end[0] - start[0];
        const dy = end[1] - start[1];
        const length = Math.hypot(dx, dy) || 1;
        const t = Math.min(1, Math.max(0, ((point[0] - start[0]) * dx + (point[1] - start[1]) * dy) / (length * length)));
        const x = start[0] + dx * t;
        const y = start[1] + dy * t;
        const distance = Math.hypot(point[0] - x, point[1] - y);
        if (!best || distance < best.distance) best = { x, y, distance, along: traveled + length * t };
        traveled += length;
      }
      return best;
    }

    function pointsAttr(points) {
      return points.map((point) => point.join(",")).join(" ");
    }

    function drawMap() {
      const example = EXAMPLES[state.example];
      const waypoints = state.routes[state.example];
      const stop = example.stop
        ? '<line x1="250" y1="250" x2="330" y2="230" stroke="#e9eaec" stroke-width="3"></line>'
        : "";
      const ego = waypoints[0];
      map.innerHTML = `
        <polyline points="${pointsAttr(ROAD)}" fill="none" stroke="#3a3c38" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"></polyline>
        <polyline points="${pointsAttr(ROAD)}" fill="none" stroke="#c2c4c6" stroke-width="2" stroke-dasharray="10 12" stroke-linecap="round"></polyline>
        ${stop}
        <polyline points="${pointsAttr(waypoints)}" fill="none" stroke="#e9eaec" stroke-width="2"></polyline>
        ${waypoints.map((point) => `<circle cx="${point[0]}" cy="${point[1]}" r="5" fill="#17181a" stroke="#e9eaec"></circle>`).join("")}
        <rect x="${ego[0] - 8}" y="${ego[1] - 12}" width="16" height="24" rx="3" fill="#d7d8da"></rect>
      `;
    }

    function renderExamples(target, current) {
      target.innerHTML = Object.entries(EXAMPLES).map(([id, example]) => `
        <button type="button" class="example" data-example="${id}" aria-current="${id === current}">
          <b>${example.name}</b>
          <span>${example.hint}</span>
        </button>
      `).join("");
      target.querySelectorAll(".example").forEach((button) => {
        button.addEventListener("click", () => {
          state.example = button.dataset.example;
          state.launched = false;
          state.tabs = false;
          render();
        });
      });
    }

    function renderTabs() {
      const names = state.job === "scenario" ? SCENARIO_TABS : RUN_TABS;
      if (state.tab >= names.length) state.tab = 0;
      document.getElementById("tablist").innerHTML = names.map((name, index) =>
        `<button type="button" role="tab" aria-selected="${index === state.tab}" data-tab="${index}">${name}</button>`
      ).join("");
      document.getElementById("tablist").querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.tab = Number(button.dataset.tab);
          render();
        });
      });
      document.getElementById("tab-name").textContent = names[state.tab];
    }

    function render() {
      const example = EXAMPLES[state.example];
      document.getElementById("job-scenario").setAttribute("aria-pressed", String(state.job === "scenario"));
      document.getElementById("job-run").setAttribute("aria-pressed", String(state.job === "run"));
      document.getElementById("title").textContent = state.job === "scenario" ? "Scenarios" : "Run Configuration";
      document.getElementById("subtitle").textContent = example.name;
      document.getElementById("tabs-toggle").textContent = state.tabs ? "Show the short screen" : "Show today's tabs";
      document.getElementById("scenario-screen").hidden = state.job !== "scenario" || state.tabs;
      document.getElementById("run-screen").hidden = state.job !== "run" || state.tabs;
      document.getElementById("tabs-screen").hidden = !state.tabs;
      const launch = document.getElementById("launch");
      launch.hidden = state.job !== "run" || state.tabs;
      launch.textContent = state.launched ? "Launched" : "Launch";
      launch.setAttribute("aria-pressed", String(state.launched));
      document.getElementById("defaults").textContent = `Ego. ${example.driver}`;
      renderExamples(document.getElementById("scenario-examples"), state.example);
      renderExamples(document.getElementById("run-examples"), state.example);
      if (state.tabs) renderTabs();
      else drawMap();
    }

    document.getElementById("job-scenario").addEventListener("click", () => {
      state.job = "scenario";
      state.tabs = false;
      render();
    });
    document.getElementById("job-run").addEventListener("click", () => {
      state.job = "run";
      state.tabs = false;
      render();
    });
    document.getElementById("tabs-toggle").addEventListener("click", () => {
      state.tabs = !state.tabs;
      state.tab = 0;
      render();
    });
    document.getElementById("scenario-more").addEventListener("click", () => {
      state.job = "scenario";
      state.tabs = true;
      state.tab = 0;
      render();
    });
    document.getElementById("run-more").addEventListener("click", () => {
      state.job = "run";
      state.tabs = true;
      state.tab = 0;
      render();
    });
    document.getElementById("launch").addEventListener("click", () => {
      state.launched = true;
      render();
    });
    document.getElementById("vehicle").addEventListener("change", () => {
      state.launched = false;
      render();
    });
    map.addEventListener("click", (event) => {
      const rect = map.getBoundingClientRect();
      const point = [
        ((event.clientX - rect.left) / rect.width) * 640,
        ((event.clientY - rect.top) / rect.height) * 480
      ];
      const nearest = project(point);
      if (!nearest || nearest.distance > 36) return;
      const route = state.routes[state.example];
      if (route.some((waypoint) => Math.hypot(waypoint[0] - nearest.x, waypoint[1] - nearest.y) < 16)) return;
      route.push([Math.round(nearest.x), Math.round(nearest.y)]);
      route.sort((a, b) => project(a).along - project(b).along);
      drawMap();
    });

    render();
  </script>
</body>
</html>
